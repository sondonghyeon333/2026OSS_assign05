<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서 관리 시스템</title>
</head>
<body>
    <div class="container">
        <h2>도서 관리 시스템</h2>
        <!-- 입력 Form -->
        <form id="bookForm">
            <input type="hidden" id="bookId">
            <input type="text" id="title" placeholder="제목">
            <input type="text" id="author" placeholder="저자">
            <select id="category">
                <option value="">카테고리</option>
                <option value="Web">Web</option>
            </select>
            <input type="number" id="price" placeholder="가격">
            <button type="submit">저장하기</button>
        </form>
        <!-- 출력 Table -->
        <table>
            <thead>
                <tr><th>ID</th><th>제목</th><th>저자</th><th>카테고리</th><th>가격</th><th>관리</th></tr>
            </thead>
            <tbody id="bookTableBody"></tbody>
        </table>
    </div>
    <script>
        // STEP 3 JavaScript Array 데이터 구성
        let books = [
            { id: 1, title: "HTML", author: "Kim", category: "Web", price: 10000 },
            { id: 2, title: "CSS", author: "Lee", category: "Web", price: 12000 },
            { id: 3, title: "JavaScript", author: "Park", category: "Web", price: 15000 }
        ];
        // HTML 요소들을 자바스크립트 변수로 가져오기
        const bookForm = document.getElementById("bookForm");
        const titleInput = document.getElementById("title");
        const authorInput = document.getElementById("author");
        const categorySelect = document.getElementById("category");
        const priceInput = document.getElementById("price");
        const bookTableBody = document.getElementById("bookTableBody"); 
        // STEP 6: Read 구현 , Array 데이터를 화면에 그려주는 render 함수를 사용해서
        function render() {
            // 테이블 몸통 내부를 초기화한 뒤 배열 데이터로 다시 채움
            bookTableBody.innerHTML = "";

            books.forEach(book => {
                const row = `
                    <tr>
                        <td>${book.id}</td>
                        <td>${book.title}</td>
                        <td>${book.author}</td>
                        <td>${book.category}</td>
                        <td>${book.price}</td>
                        <td>-</td>
                    </tr>
                `;
                bookTableBody.innerHTML += row;
            });
        }

        // 페이지가 처음 실행되었을 때 초기 데이터 출력
        render();

        // STEP 5:  Create 구현
        bookForm.addEventListener("submit", function(e) {
            // form이 제출될 때 페이지가 새로고침되는 동작 막기
            e.preventDefault();

            // 입력한 값들을 가져오고 앞뒤 공백 제거
            const title = titleInput.value.trim();
            const author = authorInput.value.trim();
            const category = categorySelect.value;
            const price = Number(priceInput.value);

            // Validation 
            // 입력값이 올바르지 않으면 경고를 띄우고 배열에 추가하지 않기
            
            if (title === "") {
                alert("도서 제목을 입력해주세요!");
                titleInput.focus();
                return; // 함수 강제 종료 
            }

            if (author === "") {
                alert("저자를 입력해주세요!");
                authorInput.focus();
                return;
            }

            if (category === "") {
                alert("카테고리를 선택해주세요!");
                categorySelect.focus();
                return;
            }

            if (isNaN(price) || price <= 0) {
                alert("올바른 가격을 입력해주세요!");
                priceInput.focus();
                return;
            }

            // Array에 데이터 추가 
            // 새로운 아이템의 ID 만들기 마지막 아이템 ID + 1
            const newId = books.length > 0 ? books[books.length - 1].id + 1 : 1;

            // 입력받은 값들로 새로운 도서 객체 만들기
            const newBook = {
                id: newId,
                title: title,
                author: author,
                category: category,
                price: price
            };

            // push() 메서드를 이용해 배열에 데이터 추가
            books.push(newBook);

            // Form 입력값 초기화 
            bookForm.reset();
            // 데이터가 추가된 후 화면을 보기 위해 다시 render() 함수 호출
            render();
        });
        

    </script>

</body>
</html>
