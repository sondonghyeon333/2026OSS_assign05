<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서 관리 시스템</title>
    <style>
        /* 전체 Page Layout */
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .container {
            width: 650px;
            margin: 0 auto;
            border: 2px solid black;
            padding: 20px;
            background-color: #ffffff;
        }

        h2 {
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
        }

        /*  폼 영역  */
        #bookForm {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #eFEFEF;
            border: 1px solid #999;
        }

        /* Input / Select */
        #bookForm input {
            width: 100px;
            padding: 4px;
            margin-right: 4px;
        }

        #bookForm select {
            width: 90px;
            padding: 4px;
            margin-right: 4px;
        }

        /* 저장 버튼 */
        #bookForm button {
            padding: 5px 12px;
            background-color: #ddd;
            border: 1px solid #666;
            cursor: pointer;
        }

        /* Hover 효과 : 저장 버튼에 마우스 올렸을 때 */
        #bookForm button:hover {
            background-color: #ccc;
        }

        /* Table  */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 6px;
            text-align: center;
            font-size: 13px;
        }

        th {
            background-color: #dcdcdc;
        }

        /* [Hover 효과] 테이블 줄에 마우스 올렸을 때 배경색 변경 */
        tbody tr:hover {
            background-color: #f1f1f1;
        }

        /* 수정 / 삭제 버튼 */
        td button {
            padding: 3px 6px;
            font-size: 11px;
            cursor: pointer;
            border: 1px solid #444;
            background-color: #e0e0e0;
        }

        /* Hover 효과 : 수정/삭제 버튼에 마우스 올렸을 때 */
        td button:hover {
            background-color: #b5b5b5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>도서 관리 시스템</h2>
        <!-- 입력 Form -->
        <form id="bookForm">
            <input type="hidden" id="bookId">
            <input type="text" id="title" placeholder="제목">
            <input type="text" id="author" placeholder="저자">
            <select id="category">
                <option value="">카테고리</option>
                <option value="Web">Web</option>
            </select>
            <input type="number" id="price" placeholder="가격">
            <button type="submit">저장하기</button>
        </form>
        <!-- 출력 Table -->
        <table>
            <thead>
                <tr><th>ID</th><th>제목</th><th>저자</th><th>카테고리</th><th>가격</th><th>관리</th></tr>
            </thead>
            <tbody id="bookTableBody"></tbody>
        </table>
    </div>
    <script>
        // STEP 3 JavaScript Array 데이터 구성
        let books = [
            { id: 1, title: "HTML", author: "Kim", category: "Web", price: 10000 },
            { id: 2, title: "CSS", author: "Lee", category: "Web", price: 12000 },
            { id: 3, title: "JavaScript", author: "Park", category: "Web", price: 15000 }
        ];
        // HTML 요소들을 자바스크립트 변수로 가져오기
        const bookIdInput = document.getElementById("bookId");
        const bookForm = document.getElementById("bookForm");
        const titleInput = document.getElementById("title");
        const authorInput = document.getElementById("author");
        const categorySelect = document.getElementById("category");
        const priceInput = document.getElementById("price");
        const bookTableBody = document.getElementById("bookTableBody"); 
        // STEP 6: Read 구현 , Array 데이터를 화면에 그려주는 render 함수를 사용해서
        function render() {
            // 테이블 몸통 내부를 초기화한 뒤 배열 데이터로 다시 채움
            bookTableBody.innerHTML = "";

            books.forEach(book => {
                const row = `
                    <tr>
                        <td>${book.id}</td>
                        <td>${book.title}</td>
                        <td>${book.author}</td>
                        <td>${book.category}</td>
                        <td>${book.price}</td>
                        <td><button type="button" onclick="editBook(${book.id})">수정</button>
                            <button type="button" onclick="deleteBook(${book.id})">삭제</button>
                        </td>
                    </tr>
                `;
                bookTableBody.innerHTML += row;
            });
        }

        // 페이지가 처음 실행되었을 때 초기 데이터 출력
        render();
        // STEP 7 : 수정버튼을 누르면 기존 데이터를 Form에 집어넣어 주는 함수
        function editBook(id) {
            // 배열에서 클릭한 ID와 일치하는 책 찾기
            const book = books.find(b => b.id === id);
            if (!book) return;

            // Form 입력창들에 기존 데이터 채워넣기
            bookIdInput.value = book.id; // ID 칸에 기록 
            titleInput.value = book.title;
            authorInput.value = book.author;
            categorySelect.value = book.category;
            priceInput.value = book.price;
        }
        // STEP 8: Delete 구현 
        function deleteBook(id) {
            //  사용자에게 삭제 여부 확인 팝업 띄우기
            if (confirm("삭제하시겠습니까?")) {
                
                // 삭제할 데이터가 배열 몇 번째에 있는지 인덱스 찾기
                const index = books.findIndex(b => b.id === id);

                // 찾았다면 배열에서 해당 데이터 삭제하기
                if (index !== -1) {
                    books.splice(index, 1); // 배열에서 index 위치의 데이터 1개 제거
                }

                // 삭제된 반영된 데이터를 화면에 보여주기 
                render();
            }
        }

        // STEP 5 Create 구현과 STEP 7 Update 처리
        bookForm.addEventListener("submit", function(e) {
            // form이 제출될 때 페이지가 새로고침되는 동작 막기
            e.preventDefault();

            // 숨겨진 input에서 id 값을 가져오기
            const id = bookIdInput.value;
            // 입력한 값들을 가져오고 앞뒤 공백 제거
            const title = titleInput.value.trim();
            const author = authorInput.value.trim();
            const category = categorySelect.value;
            const price = Number(priceInput.value);

            // STEP 9 : Validation 
            // 입력값이 올바르지 않으면 경고를 띄우고 배열에 추가하지 않기
            
            if (title === "") {
                alert("도서 제목을 입력해주세요!");
                titleInput.focus();
                return; // 함수 강제 종료 
            }

            if (author === "") {
                alert("저자를 입력해주세요!");
                authorInput.focus();
                return;
            }

            if (category === "") {
                alert("카테고리를 선택해주세요!");
                categorySelect.focus();
                return;
            }

            if (isNaN(price) || price <= 0) {
                alert("올바른 가격을 입력해주세요!");
                priceInput.focus();
                return;
            }
            //  ID가 비어있으면 추가(Create), 있으면 수정(Update)
            if (id === "") {
                // Create
                // Array에 데이터 추가 
                // 새로운 아이템의 ID 만들기 마지막 아이템 ID + 1
                const newId = books.length > 0 ? books[books.length - 1].id + 1 : 1;
                 // 입력받은 값들로 새로운 도서 객체 만들기
                const newBook = { id: newId, title, author, category, price };
                // push() 메서드를 이용해 배열에 데이터 추가
                books.push(newBook);
            } else {
                // Update
                const index = books.findIndex(b => b.id === Number(id));
                if (index !== -1) {
                    books[index].title = title;
                    books[index].author = author;
                    books[index].category = category;
                    books[index].price = price;
                }
                // 수정이 끝났으니 숨겨진 ID 초기화 
                bookIdInput.value = "";
            }
        
            // Form 입력값 초기화 
            bookForm.reset();
            // 데이터가 추가된 후 화면을 보기 위해 다시 render() 함수 호출
            render();
        });
        

    </script>

</body>
</html>
