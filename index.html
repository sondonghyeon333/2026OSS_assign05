<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>과제 모음 페이지</title>
    <style>
        /* 전체 Page Layout*/
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .container {
            width: 650px;
            margin: 0 auto;
            border: 2px solid black;
            padding: 20px;
            background-color: #ffffff;
        }

        h2 {
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
        }

        /*  링크 목록 스타일 */
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 10px;
        }

        /*  버튼처럼 만든 링크 박스 */
        a {
            display: block;
            padding: 10px;
            background-color: #eFEFEF;
            border: 1px solid #999;
            color: black;
            text-decoration: none;
            text-align: center;
            font-size: 14px;
        }

        /* Hover 효과 :링크에 마우스 올렸을 때 배경색 변경 */
        a:hover {
            background-color: #dcdcdc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>웹 프로그래밍 과제 목록</h2>
        
        <!-- 링크 목록 -->
        <ul>
            <li><a href="https://2026ossassign05-sandy.vercel.app/js_dynamic.html">JavaScript DOM Practice</a></li>
            <li><a href="https://2026ossassign05-sandy.vercel.app/crud.html">Simple CRUD Service</a></li>
        </ul>
    </div>
</body>
</html>
